name: 仓库设置

# 一次性任务：设置仓库描述与 topics。
#
# 为什么需要它：仓库元数据（description / topics）只能通过 API 修改，
# SSH 推送改不了。仓库自带的 GITHUB_TOKEN 有这个权限。
#
# 手动触发：Actions → 仓库设置 → Run workflow
# 若自动触发失败，多半是仓库的 Actions 权限被设成了「只读」——
# 去 Settings → Actions → General → Workflow permissions 改成
# 「Read and write permissions」。

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/repo-setup.yml'

permissions:
  contents: write

jobs:
  setup:
    name: 设置描述与 topics
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 设置仓库元数据
        uses: actions/github-script@v7
        with:
          script: |
            const lines = [];
            const log = (m) => { core.info(m); lines.push(m); };

            log('token 权限: ' + JSON.stringify(context.payload));

            try {
              const r = await github.rest.repos.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                description: 'WordPress 商品导购与评测主题：商品管理、品牌品类分类、限时特惠、SEO、整页缓存与图片优化。开源基础版（GPL v2）。',
              });
              log('✅ 描述已更新');
            } catch (e) {
              log('❌ 设置描述失败: ' + e.status + ' ' + e.message);
            }

            try {
              await github.rest.repos.replaceAllTopics({
                owner: context.repo.owner,
                repo: context.repo.repo,
                topicNames: [
                  'wordpress',
                  'wordpress-theme',
                  'wordpress-themes',
                  'theme',
                  'blog',
                  'custom-logo',
                  'custom-menu',
                  'featured-images',
                  'translation-ready',
                  'product-showcase',
                  'seo',
                  'webp',
                  'chinese',
                ],
              });
              log('✅ topics 已设置');
            } catch (e) {
              log('❌ 设置 topics 失败: ' + e.status + ' ' + e.message);
            }

            try {
              await github.rest.repos.enableSecurityManager({
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
              log('✅ security manager 已开启');
            } catch (e) {
              log('⚠️ security manager: ' + e.status + ' ' + e.message);
            }

            await core.summary.addRaw(lines.join('\n')).write();
